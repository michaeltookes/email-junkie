name: Claude PR Description

# Auto-fill empty PR descriptions (backlog item 19): when a PR is opened
# with no body, Claude writes one from the diff. PRs opened with a
# description are left untouched — the guard is the deterministic job-level
# `if`, not model judgment. Triggers on `opened` only, never `synchronize`,
# so a description is written at most once and never rewritten under the
# author.
#
# Portable by design: no repo-specific content below, so this file can be
# dropped into any repo with the Claude GitHub app installed.

on:
  pull_request:
    types: [opened]

jobs:
  fill-description:
    # Empty-body check: `== ''` also matches a null body (GitHub expression
    # comparisons coerce null to ''). Same-repo head gate: fork PRs run
    # without secrets, so the action could only fail there — and a fork
    # head is untrusted input this workflow should not process anyway.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.body == ''
    runs-on: ubuntu-latest
    # A missing description is cosmetic. This job must never leave a failing
    # check on the PR: a red here would block the watcher's merge-ready gate
    # and could trigger doomed "fix CI" passes against a workflow the PR
    # branch cannot even see. With job-level continue-on-error the check
    # concludes successfully even if the step fails.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write PR description from the diff
        id: describe
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            Pull request ${{ github.repository }}#${{ github.event.pull_request.number }} was opened with an empty description. Return a description written from its diff.

            1. Re-check the current body first: `gh pr view ${{ github.event.pull_request.number }} --json body`. If it is no longer empty — the author added a description after opening — stop immediately without changing anything.
            2. Read the change: `gh pr diff ${{ github.event.pull_request.number }}` (and `gh pr view ${{ github.event.pull_request.number }} --json title,commits` for commit-message context).
            3. Compose a concise Markdown description: a 1-3 sentence summary of what the change does and why, then a short bullet list of the main changes grouped by area (source, tests, docs, config). Describe behavior, not file-by-file mechanics. Only state motivation that is evident from the diff or commit messages — do not invent rationale.
            4. Return structured output only: `should_update: true` and `body: <the description>` when the body is still empty; otherwise `should_update: false` and `body: ""`.

            Do nothing else: no comments, no reviews, no labels, no code changes.
          claude_args: |
            --permission-mode dontAsk
            --tools Bash
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '{"type":"object","properties":{"should_update":{"type":"boolean"},"body":{"type":"string"}},"required":["should_update","body"],"additionalProperties":false}'

      - name: Apply PR description
        if: fromJSON(steps.describe.outputs.structured_output).should_update == true
        shell: bash
        env:
          BODY_JSON: ${{ steps.describe.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_body="$(gh pr view '${{ github.event.pull_request.number }}' --repo '${{ github.repository }}' --json body --jq '.body // ""')"
          if [ -n "$current_body" ]; then
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          python3 - "$body_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(os.environ["BODY_JSON"])
          body = data.get("body", "")
          if not isinstance(body, str) or not body.strip():
              raise SystemExit("structured output did not include a non-empty body")
          Path(sys.argv[1]).write_text(body, encoding="utf-8")
          PY

          gh pr edit '${{ github.event.pull_request.number }}' --repo '${{ github.repository }}' --body-file "$body_file"
