name: Release

# Turns a version-tag push into a complete Sentwise release: it runs the release
# gate (SwiftLint strict + full test suite), signs and notarizes the app, builds
# and notarizes the DMG, runs the launch smoke test, publishes a GitHub release
# with the CHANGELOG section as notes, updates the Sparkle appcast, and bumps the
# Homebrew tap cask.
#
# The heavy lifting lives in Distribution/scripts/release.sh — the SAME script
# the maintainer runs locally. CI only supplies credentials from encrypted
# secrets; it does not fork a second pipeline.
#
# Triggers:
#   - push of a tag matching v*        -> full signed release + publish
#   - workflow_dispatch (dry_run=true) -> whole plumbing unsigned, no publish,
#                                         so the workflow is testable without
#                                         secrets or a tag.
#
# Required repository secrets (values never live in the repo; see
# docs/ci-release.md for the exact command that produces each one):
#   MACOS_CERTIFICATE_P12            base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD       password protecting that .p12
#   APPLE_ID                         Apple ID email (notarytool)
#   APPLE_TEAM_ID                    10-char Apple Developer Team ID
#   NOTARY_APP_SPECIFIC_PASSWORD     app-specific password (notarytool)
#   SPARKLE_ED_PRIVATE_KEY           EdDSA private key (generate_keys -x export)
#   TAP_PUSH_TOKEN                   PAT with push access to michaeltookes/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Unsigned dry run (archive + DMG layout + smoke test, no signing/notarization/publish)"
        type: boolean
        default: true

# The publish step needs write access to create the GitHub release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 'true' only for a workflow_dispatch run with the box checked; a tag push
      # (or an unchecked dispatch) is always a real, signed release.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the tag and CHANGELOG are available

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DRY_RUN=$DRY_RUN"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 'MARKETING_VERSION = ' \
              Sentwise/Sentwise.xcodeproj/project.pbxproj | sed 's/.*= //; s/;.*//')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

      # ---- release gate: lint + full test suite (always, both modes) ----------
      - name: SwiftLint (strict)
        working-directory: Sentwise
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint --version
          swiftlint lint --strict

      - name: Test mail package
        run: |
          cd Packages/SentwiseMail
          swift test

      - name: Build & test app
        working-directory: Sentwise
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sentwise.xcodeproj \
            -scheme Sentwise \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # ---- signing setup (skipped on dry run) ---------------------------------
      - name: Import Developer ID certificate
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sentwise-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          # Create a throwaway keychain, unlock it, and add it to the search list
          # so codesign/xcodebuild can find the identity.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[",]//g')
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in the imported keychain." >&2
            exit 1
          fi
          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "SIGNING_KEYCHAIN_PW=$KEYCHAIN_PW"
          } >> "$GITHUB_ENV"
          echo "Imported: $IDENTITY"

      - name: Fetch Sparkle release tools (pinned)
        if: env.DRY_RUN != 'true'
        env:
          SPARKLE_VERSION: "2.9.5" # keep in lockstep with the Sparkle SPM pin
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          test -x "$RUNNER_TEMP/sparkle/bin/generate_appcast"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Stage Sparkle EdDSA private key
        if: env.DRY_RUN != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          echo "SPARKLE_ED_KEY_FILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: |
          set -euo pipefail
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      # ---- the pipeline (same script as local); smoke test runs inside it ------
      - name: Run release pipeline
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            Distribution/scripts/release.sh --dry-run \
              --version "${{ steps.version.outputs.version }}"
          else
            security unlock-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN"
            Distribution/scripts/release.sh \
              --version "${{ steps.version.outputs.version }}"
          fi

      # ---- publish (skipped on dry run and on non-tag runs) -------------------
      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # Same section-slice the manual flow used: everything between the
          # '## [X.Y.Z]' heading and the next '## [' heading.
          notes="$(awk -v ver="$v" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md)"
          # Strip leading/trailing blank lines.
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d' | tail -r | sed -e '/./,$!d' | tail -r)"
          if [[ -z "$notes" ]]; then
            notes="Release v$v"
          fi
          printf '%s\n' "$notes" > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" \
            "dist/Sentwise-$v.dmg" \
            "dist/appcast.xml" \
            "dist/Sentwise-$v.dmg.sha256" \
            --title "v$v" \
            --notes-file "$NOTES_FILE" \
            --verify-tag

      - name: Update Homebrew tap cask
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          sha="$(cut -d' ' -f1 "dist/Sentwise-$v.dmg.sha256")"

          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/michaeltookes/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"

          # Sync the whole cask from this repo's template, then stamp version
          # + sha256.
          cp Distribution/sentwise.rb "$RUNNER_TEMP/tap/Casks/sentwise.rb"
          cask="$RUNNER_TEMP/tap/Casks/sentwise.rb"
          /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"$v\"/" "$cask"
          /usr/bin/sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"

          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sentwise.rb
          if git diff --cached --quiet; then
            echo "Tap cask already up to date for $v."
          else
            git commit -m "sentwise: $v"
            git push
          fi

      # ---- always clean up the signing keychain -------------------------------
      - name: Remove signing keychain
        if: always() && env.DRY_RUN != 'true'
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN:-/nonexistent}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
