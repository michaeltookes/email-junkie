# Prowl configuration — Sentwise macOS menu bar app (experimental macOS target).
# Requires the locally-built prowl CLI (npm link from the prowl repo) and its
# prowl-macdriver Swift helper. See .prowl/README.md for setup and permissions.
#
# Hunt mode launches with a seeded in-memory fixture account (see
# ProwlHuntRuntime.swift) so the account-gated surfaces — follow-up composer,
# review window, mailbox browser — are reachable. The fixture uses `.invalid`
# hosts and no LLM key, so nothing can reach a real mail server or provider.

target:
  type: macos
  app: .prowl/DerivedData/Build/Products/Debug/Sentwise.app

browser:
  timeout: 30000        # also bounds app-launch wait for the macOS target

artifacts:
  screenshots: "on-failure"   # screenshots need Screen Recording permission

# Safety guardrails. forbiddenSelectors is substring-matched against every
# selector. Hunts are open-and-assert only: they may open windows but never
# trigger an action that mutates state, dispatches mail, calls an LLM, runs a
# mailbox search, or touches system settings. The substring selector families
# (`menu=`, `text=`) stay disabled because short substrings can resolve to
# unsafe menu items; menu actions must use the explicit AX identifiers the app
# assigns to safe items (`id=openSettings`, `id=openActivityMenu`,
# `id=openSetupAssistant`, `id=openFollowUpComposer`, `id=openReviewWindow`,
# `id=openBrowseMailbox`).
guardrails:
  maxSteps: 25
  allowedApps:
    - .prowl/DerivedData/Build/Products/Debug/Sentwise.app
    - com.tookes.Sentwise
  forbiddenSelectors:
    # Substring selector families — too easy to hit an unsafe element.
    - "menu="
    - "text="
    # Mail dispatch / draft mutation inside the composer and review windows.
    - "Send"
    - "send"
    - "Approve"
    - "approve"
    - "Deny"
    - "deny"
    - "Discard"
    - "discard"
    - "Delete"
    - "delete"
    - "Save"
    - "save"
    - "Generate"
    - "generate"
    # Live-connection actions (settings test, mailbox search, watching).
    - "Connect"
    - "connect"
    - "Test"
    - "test"
    - "Search"
    - "search"
    - "Start"
    - "start"
    - "Pause"
    - "pause"
    # System-level toggles and app lifecycle.
    - "Login"
    - "login"
    - "Launch"
    - "launch"
    - "Check"
    - "check"
    - "Update"
    - "update"
    - "Quit"
    - "quit"
