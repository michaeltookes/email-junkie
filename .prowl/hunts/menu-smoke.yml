# Smoke test: the status item exists, its menu opens, and the core read-only
# items are present. Sentwise's NSMenuItems expose titles, not AX identifiers,
# so this hunt uses title substrings. Read-only.
#
# Run it:  prowl run menu-smoke

name: menu-smoke
description: Open the Sentwise status-item menu and verify safe core items exist

steps:
  # `statusItem` is the macOS target's magic selector: find the app's menu bar
  # extra and press it, leaving the menu open for the assertions below.
  - click:
      selector: statusItem

  - assert:
      visible: text="Settings"

  - assert:
      visible: text="Activity History"

  - assert:
      visible: text="Setup Assistant"
