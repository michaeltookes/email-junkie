# Smoke test: the status item exists, its menu opens, and the core items are
# present. Uses the AX identifiers Sentwise's MenuBarController sets on its
# NSMenuItems, so this is stable across title changes. Read-only.
#
# Run it:  prowl run menu-smoke

name: menu-smoke
description: Open the Sentwise status-item menu and verify its core items exist

steps:
  # `statusItem` is the macOS target's magic selector: find the app's menu bar
  # extra and press it, leaving the menu open for the assertions below.
  - click:
      selector: statusItem

  - assert:
      visible: id=openSettings

  - assert:
      visible: id=openActivityMenu

  - assert:
      visible: id=quit
