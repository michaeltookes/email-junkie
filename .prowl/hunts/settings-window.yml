# Settings surface (item 65 restyle work happens here): open the Settings
# window from the status-item menu and verify it appears. Window matching uses
# the exact AX label Sentwise sets via setAccessibilityLabel. Read-only — no
# values are changed and no connection test is run.
#
# Run it:  prowl run settings-window

name: settings-window
description: Open the Settings window from the menu and verify it appears

steps:
  - click:
      selector: statusItem

  - click:
      selector: id=openSettings

  - waitForSelector:
      selector: label="Sentwise Settings"
      timeout: 10000
