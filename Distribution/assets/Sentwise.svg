<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Sentwise">
  <title>Sentwise</title>
  <defs>
    <linearGradient id="plate" x1="0.42" y1="0" x2="0.58" y2="1">
      <stop offset="0" stop-color="#A08CF5"></stop>
      <stop offset="0.46" stop-color="#6D4BE0"></stop>
      <stop offset="1" stop-color="#4A2CB0"></stop>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.06" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"></stop>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#ECEAF6"></stop>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8460EE"></stop>
      <stop offset="1" stop-color="#6741DC"></stop>
    </linearGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFEFA8"></stop>
      <stop offset="1" stop-color="#FFB33C"></stop>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"></rect>
    </clipPath>
    <filter id="envShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#1C0C46" flood-opacity="0.34"></feDropShadow>
    </filter>
    <filter id="sparkShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="13" flood-color="#3C1E0A" flood-opacity="0.40"></feDropShadow>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="40" stdDeviation="35" flood-color="#28145A" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  
  <g transform="translate(100, 88) scale(0.8047)" filter="url(#dropShadow)">
    <g clip-path="url(#plateClip)">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#plate)"></rect>
      <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"></rect>
      <rect x="0" y="0" width="1024" height="16" fill="#ffffff" opacity="0.32"></rect>
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="10"></rect>
    </g>

    <g filter="url(#envShadow)">
      <rect x="186" y="318" width="652" height="436" rx="56" ry="56" fill="url(#paper)"></rect>
    </g>
    <path d="M186 374 A56 56 0 0 1 242 318 L782 318 A56 56 0 0 1 838 374 L512 594 Z" fill="url(#flap)"></path>
    <rect x="186" y="318" width="652" height="436" rx="56" ry="56" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6"></rect>

    <g filter="url(#sparkShadow)">
      <polygon points="726,118 756,238 876,268 756,298 726,418 696,298 576,268 696,238" fill="url(#gold)"></polygon>
    </g>
    <polygon points="550,236 560.4,277.6 602,288 560.4,298.4 550,340 539.6,298.4 498,288 539.6,277.6" fill="#FBE79A" opacity="0.9"></polygon>
  </g>
</svg>